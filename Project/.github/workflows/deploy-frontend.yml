name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "Project/my-frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # adds a "Run workflow" button for manual deploys

permissions:
  id-token: write # lets the job request an OIDC token to assume the AWS role
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project/my-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Project/my-frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed files (index-GVNx8tkK.js) never change under the same name, so cache them for a year
      - name: Upload hashed assets
        run: aws s3 sync dist/assets s3://${{ vars.S3_BUCKET }}/assets --delete --cache-control "public,max-age=31536000,immutable"

      # favicons, locales, logos. No --delete, so uploads/ and images/ are never touched
      - name: Upload other files
        run: aws s3 sync dist s3://${{ vars.S3_BUCKET }} --exclude "assets/*" --exclude "index.html" --exclude "uploads/*" --exclude "images/*"

      # index.html always gets checked fresh, so new builds show up immediately
      - name: Upload index.html
        run: aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/index.html" "/locales/*"